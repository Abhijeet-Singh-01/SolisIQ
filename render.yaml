services:
  - type: web
    name: solis-iq-backend
    env: python
    region: oregon
    plan: free
    
    # Build command - install dependencies from backend/requirements.txt
    buildCommand: pip install -r backend/requirements.txt
    
    # Start command - use gunicorn from repository root, chdir to backend
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT app:app
    
    # Health check
    healthCheckPath: /
    
    # Environment variables - set in Render dashboard
    # These are REQUIRED to be set in Render:
    # FLASK_ENV=production
    # SECRET_KEY=<secure random string>
    # DB_HOST=<Aiven host>
    # DB_PORT=11461
    # DB_USER=avnadmin
    # DB_PASSWORD=<from Aiven dashboard>
    # DB_NAME=defaultdb
    # DB_CONNECTION_TIMEOUT=5
    # CORS_ORIGINS=<your frontend URL>
    # USE_SSL=true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: USE_SSL
        value: "true"

